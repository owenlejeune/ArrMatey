name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      composeApp: ${{ steps.filter.outputs.composeApp }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            composeApp:
              - 'composeApp/**'
            shared:
              - 'shared/**'
              - 'networking/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/android.yml'

  check-and-build:
    name: Lint, Test, and Build Android
    needs: changes
    if: ${{ needs.changes.outputs.composeApp == 'true' || needs.changes.outputs.shared == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # jdks isn't cached by default, so the pinned daemon JVM re-downloads every run.
          gradle-home-cache-includes: |
            caches
            notifications
            jdks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint, Tests, and Build Debug APK (Shared and Android)
        if: ${{ needs.changes.outputs.shared == 'true' || github.event_name != 'pull_request' }}
        # The `test` lifecycle task only reaches :composeApp.
        run: >
          ./gradlew spotlessCheck lintDebug
          :shared:testAndroidHostTest
          :networking:testAndroidHostTest
          :composeApp:testDebugUnitTest
          :composeApp:assembleDebug --continue

      - name: Run Lint, Tests, and Build Debug APK (composeApp only)
        if: ${{ needs.changes.outputs.shared != 'true' && needs.changes.outputs.composeApp == 'true' && github.event_name == 'pull_request' }}
        run: >
          ./gradlew :composeApp:spotlessCheck :composeApp:lintDebug
          :composeApp:testDebugUnitTest
          :composeApp:assembleDebug --continue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/build/test-results/**/*.xml"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
