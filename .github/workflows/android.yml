name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      composeApp: ${{ steps.filter.outputs.composeApp }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            composeApp:
              - 'composeApp/**'
            shared:
              - 'shared/**'
              - 'networking/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/android.yml'

  check-and-build:
    name: Lint, Test, and Build Android
    needs: changes
    if: ${{ needs.changes.outputs.composeApp == 'true' || needs.changes.outputs.shared == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint, Tests, and Build Debug APK (Shared and Android)
        if: ${{ needs.changes.outputs.shared == 'true' || github.event_name != 'pull_request' }}
        # The `test` lifecycle task only reaches :composeApp.
        run: >
          ./gradlew spotlessCheck lintDebug
          :shared:testAndroidHostTest
          :networking:testAndroidHostTest
          :composeApp:testDebugUnitTest
          :composeApp:assembleDebug --continue

      - name: Run Lint, Tests, and Build Debug APK (composeApp only)
        if: ${{ needs.changes.outputs.shared != 'true' && needs.changes.outputs.composeApp == 'true' && github.event_name == 'pull_request' }}
        run: >
          ./gradlew :composeApp:spotlessCheck :composeApp:lintDebug
          :composeApp:testDebugUnitTest
          :composeApp:assembleDebug --continue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: "**/build/test-results/**/*.xml"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk

  android-status:
    name: Android Status Check
    needs: [changes, check-and-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Android Status
        run: |
          changes_res="${{ needs.changes.result }}"
          build_res="${{ needs.check-and-build.result }}"
          if [[ "$changes_res" == "failure" || "$changes_res" == "cancelled" ]]; then
            echo "Changes detection failed or was cancelled."
            exit 1
          fi
          if [[ "$build_res" == "failure" || "$build_res" == "cancelled" ]]; then
            echo "Android build failed or was cancelled."
            exit 1
          fi
          echo "Android CI passed or was skipped (build: $build_res)."
