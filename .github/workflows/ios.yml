name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      iosApp: ${{ steps.filter.outputs.iosApp }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            iosApp:
              - 'iosApp/**'
            shared:
              - 'shared/**'
              - 'networking/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/ios.yml'

  build:
    name: Build and Test iOS
    needs: changes
    if: ${{ needs.changes.outputs.iosApp == 'true' || needs.changes.outputs.shared == 'true' || github.event_name != 'pull_request' }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.x'

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Cache Xcode DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: derived_data
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('iosApp/**/*.swift', 'shared/**/*.kt') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Build and Test Shared
        if: ${{ needs.changes.outputs.shared == 'true' || github.event_name != 'pull_request' }}
        # allTests would also re-run testAndroidHostTest, which the Linux job covers.
        run: ./gradlew :shared:iosSimulatorArm64Test :networking:iosSimulatorArm64Test

      - name: Upload Shared Test Results
        if: ${{ (needs.changes.outputs.shared == 'true' || github.event_name != 'pull_request') && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-test-results
          path: "**/build/test-results/**/*.xml"

      - name: Build and Test iOS App
        run: |
          xcodebuild test -scheme iosApp \
            -project iosApp/iosApp.xcodeproj \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath derived_data \
            -quiet

  ios-status:
    name: iOS Status Check
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate iOS Status
        run: |
          changes_res="${{ needs.changes.result }}"
          build_res="${{ needs.build.result }}"
          if [[ "$changes_res" == "failure" || "$changes_res" == "cancelled" ]]; then
            echo "Changes detection failed or was cancelled."
            exit 1
          fi
          if [[ "$build_res" == "failure" || "$build_res" == "cancelled" ]]; then
            echo "iOS build failed or was cancelled."
            exit 1
          fi
          echo "iOS CI passed or was skipped (build: $build_res)."
