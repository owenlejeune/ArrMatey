name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      iosApp: ${{ steps.filter.outputs.iosApp }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            iosApp:
              - 'iosApp/**'
            shared:
              - 'shared/**'
              - 'networking/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/ios.yml'

  build:
    name: Build and Test iOS
    needs: changes
    if: ${{ needs.changes.outputs.iosApp == 'true' || needs.changes.outputs.shared == 'true' || github.event_name != 'pull_request' }}
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # jdks isn't cached by default, so the pinned daemon JVM re-downloads every run.
          gradle-home-cache-includes: |
            caches
            notifications
            jdks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.x'

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: derived_data
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('iosApp/**/*.swift', 'shared/**/*.kt') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Build and Test Shared
        if: ${{ needs.changes.outputs.shared == 'true' || github.event_name != 'pull_request' }}
        # allTests would also re-run testAndroidHostTest, which the Linux job covers.
        run: ./gradlew :shared:iosSimulatorArm64Test :networking:iosSimulatorArm64Test

      - name: Upload Shared Test Results
        if: ${{ (needs.changes.outputs.shared == 'true' || github.event_name != 'pull_request') && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: shared-test-results
          path: "**/build/test-results/**/*.xml"

      - name: Build and Test iOS App
        run: |
          xcodebuild test -scheme iosApp \
            -project iosApp/iosApp.xcodeproj \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath derived_data \
            -quiet
