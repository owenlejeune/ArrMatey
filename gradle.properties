#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M -Djdk.lang.Process.launchMechanism=FORK
kotlin.incremental=false
kotlin.incremental.multiplatform=false

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.fullMode=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
android.sourceset.disallowProvider=false
android.experimental.r8.disable-android-platform-compliancy-check=true
android.dependency.experimental.cache.clean=true
android.controlWorkerDependencyParallelism=false
android.advanced.profileable.enabled=false

moko.resources.BUILT_PRODUCTS_DIR=${env.BUILT_PRODUCTS_DIR}
moko.resources.CONTENTS_FOLDER_PATH=${env.CONTENTS_FOLDER_PATH}
moko.resources.UNLOCALIZED_RESOURCES_FOLDER_PATH=${env.UNLOCALIZED_RESOURCES_FOLDER_PATH}